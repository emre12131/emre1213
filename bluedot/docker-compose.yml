version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     bluedot
      POSTGRES_PASSWORD: bluedot_secret
      POSTGRES_DB:       bluedot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bluedot']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Node.js API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:      postgresql://bluedot:bluedot_secret@db:5432/bluedot
      JWT_SECRET:        change_me_in_production
      JWT_EXPIRES_IN:    30d
      INTERNAL_SECRET:   internal_worker_secret
      AI_WORKER_URL:     http://ai-worker:8000
      API_URL:           http://api:4000
      PORT:              4000
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/uploads

  # ── Python AI Worker ────────────────────────────────────────────────────────
  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - uploads:/app/uploads   # shared with API so audio files are accessible
    ports:
      - '8000:8000'

  # ── Next.js Dashboard ───────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
